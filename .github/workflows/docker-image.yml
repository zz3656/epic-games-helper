name: Build and Push Docker Image

on:
  push:
    branches: [ main, master ]
    # 只在以下路径变化时触发，避免无关变更消耗 CI 资源
    paths:
      - 'app/**'
      - 'Dockerfile'
      - 'requirements.txt'
      - '.github/workflows/docker-image.yml'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'app/**'
      - 'Dockerfile'
      - 'requirements.txt'
  workflow_dispatch:  # 支持手动触发

env:
  # Docker Hub 镜像名（不要带斜杠外的字符）
  IMAGE_NAME: ${{ secrets.DOCKERHUB_IMAGE_NAME }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            # 推送主分支时打 latest 标签
            type=raw,value=latest,enable={{is_default_branch}}
            # PR 时用 sha 标签（仅构建，不推送）
            type=sha,prefix=pr-,enable=${{ github.event_name == 'pull_request' }}
            # 用 git tag 发布的版本
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          labels: |
            org.opencontainers.image.title=epic-games-claimer
            org.opencontainers.image.description=Epic Games 免费游戏自动领取
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.licenses=MIT

      - name: Build and push (main branch or tag)
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # 利用 GitHub 缓存加速后续构建
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64

      - name: Build only (pull request)
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha