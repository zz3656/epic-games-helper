name: Build and Push Docker Image

on:
  push:
    branches: [main]
    # 只在以下路径变化时触发，避免无关变更消耗 CI 资源
    paths:
      - 'app/**'
      - 'Dockerfile'
      - 'scripts/entrypoint.sh'
      - 'requirements.txt'
      - 'docker-compose.yml'
      - '.github/workflows/docker-image.yml'
      - '.github/workflows/dockerhub-readme.md'
  workflow_dispatch:  # 支持手动触发

permissions:
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: zz3656/epic-games-helper
          tags: |
            # 推送主分支时打 latest 标签
            type=raw,value=latest,enable={{is_default_branch}}
            # 用 git tag 发布的版本（如 v1.2.3）
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          labels: |
            org.opencontainers.image.title=epic-games-helper
            org.opencontainers.image.description=Epic Games 免费游戏助手 · 一键领取跳转
            org.opencontainers.image.source=https://github.com/zz3656/epic-games-helper
            org.opencontainers.image.licenses=MIT

      - name: Build and push multi-platform image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # 利用 GitHub 缓存加速后续构建
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64