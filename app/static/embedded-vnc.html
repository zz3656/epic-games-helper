<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Epic Games 自动领取 - VNC 桌面</title>
    <link rel="icon" type="image/x-icon" href="novnc/app/images/icons/novnc.ico">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="novnc/app/styles/base.css">
    <link rel="stylesheet" href="novnc/app/styles/input.css">
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: #000;
        }
        /* 隐藏 noVNC 默认的控制栏、状态栏等 */
        #noVNC_control_bar, #noVNC_control_bar_anchor,
        #noVNC_status, #noVNC_connect_panel,
        #noVNC_dials, #noVNC_button_bar,
        #noVNC_remote_pointer, #noVNC_keyboardinput {
            display: none !important;
        }
        #noVNC_container {
            position: fixed !important;
            top: 0; left: 0; right: 0; bottom: 0;
            width: 100% !important;
            height: 100% !important;
        }
        #noVNC_container canvas,
        #noVNC_container img {
            width: 100% !important;
            height: 100% !important;
        }
    </style>
</head>
<body>

    <div id="noVNC_fallback_error">
        <div>
            <div>noVNC encountered an error:</div>
            <div id="noVNC_fallback_errormsg"></div>
        </div>
    </div>

    <div id="noVNC_container">
        <textarea id="noVNC_keyboardinput" autocapitalize="off"
            autocomplete="off" spellcheck="false" tabindex="-1"></textarea>
    </div>

    <audio id="noVNC_bell">
        <source src="novnc/app/sounds/bell.oga" type="audio/ogg">
        <source src="novnc/app/sounds/bell.mp3" type="audio/mpeg">
    </audio>

    <script type="module">
        import RFB from './novnc/core/rfb.js';

        let rfb;

        function connect() {
            rfb = new RFB({
                target: document.getElementById('noVNC_container'),
                encrypt: window.location.protocol === 'https:',
            });

            rfb.addEventListener("connect", () => {
                console.log("VNC 连接成功");
                // 连接成功后立即填充视口
                fitToScreen();
            });

            rfb.addEventListener("disconnect", (e) => {
                console.log("VNC 断开", e.detail);
            });

            rfb.addEventListener("desktopname", () => {
                console.log("Desktop name:", rfb.display.name);
                // 桌面名称变更后重新适配
                fitToScreen();
            });

            const wsProtocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            const wsUrl = `${wsProtocol}//${location.host}/vnc-ws`;
            console.log("连接到:", wsUrl);
            rfb.connect(wsUrl, '');
        }

        function fitToScreen() {
            const container = document.getElementById('noVNC_container');
            if (!rfb || !rfb.display) return;
            const w = container.clientWidth;
            const h = container.clientHeight;
            if (w > 0 && h > 0) {
                rfb.display.scale = 1;
                rfb.scaleViewport = true;
                // 触发重绘
                rfb.display.dirty();
                rfb.display.sync();
            }
        }

        // 窗口大小变化时自动适配
        let resizeTimer;
        window.addEventListener('resize', () => {
            clearTimeout(resizeTimer);
            resizeTimer = setTimeout(fitToScreen, 200);
        });

        // 页面加载后自动连接
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', connect);
        } else {
            connect();
        }
    </script>
</body>
</html>
