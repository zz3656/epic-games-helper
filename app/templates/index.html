<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Epic Games 免费游戏助手</title>
    <link rel="stylesheet" href="/static/style.css?v=3">
</head>
<body>

<!-- ===== Epic 风格顶部导航 ===== -->
<nav class="epic-nav">
    <div class="epic-nav-inner">
        <div class="epic-nav-logo">
            <svg viewBox="0 0 24 24" fill="currentColor">
                <path d="M5 5 L19 5 L19 8 L12 13 L5 8 Z"/>
                <path d="M5 12 L12 17 L19 12 L19 19 L5 19 Z"/>
            </svg>
            EPIC HELPER
            <span class="epic-nav-version">v3.0</span>
        </div>
        <div class="epic-nav-spacer"></div>
        <div class="epic-nav-status" id="nav-status">
            <span class="nav-status-dot" id="nav-status-dot"></span>
            <span id="nav-status-text">已连接</span>
        </div>
    </div>
</nav>

<div class="epic-container">

    <!-- ===== Hero 横幅 ===== -->
    <div class="epic-hero">
        <div class="epic-hero-content">
            <span class="epic-hero-kicker">FREE GAMES TRACKER</span>
            <h1>每周免费游戏<br>追踪器</h1>
            <p>追踪 Epic 每周免费游戏 · 记录历史赠送清单 · 一键跳转 Epic 领取</p>
        </div>
    </div>

    <!-- ===== 本周免费游戏 ===== -->
    <section class="epic-section" id="weekly-free-section" hidden>
        <div class="epic-section-header">
            <h2 class="epic-section-title">🎮 本周免费游戏</h2>
            <span class="epic-section-meta" id="weekly-free-hint">加载中…</span>
        </div>
        <div id="weekly-free-grid" class="game-grid"></div>
    </section>

    <!-- ===== 历史赠送游戏 ===== -->
    <section class="epic-section" id="weekly-history-section" hidden>
        <div class="epic-section-header">
            <h2 class="epic-section-title">📜 历史赠送游戏</h2>
            <span class="epic-section-meta">按周分组</span>
        </div>
        <div id="weekly-history-grid"></div>
    </section>

    <!-- ===== 调试区 ===== -->
    <section class="epic-section">
        <details class="debug-section">
            <summary>🛠 调试选项</summary>
            <div class="debug-actions">
                <button type="button" id="test-free-games-btn" class="btn-epic btn-epic-ghost btn-epic-sm">测试免费游戏 API</button>
                <button type="button" id="refresh-weekly-btn" class="btn-epic btn-epic-ghost btn-epic-sm">刷新本周游戏</button>
                <button type="button" id="test-history-btn" class="btn-epic btn-epic-ghost btn-epic-sm">刷新历史记录</button>
                <button type="button" id="test-raw-btn" class="btn-epic btn-epic-ghost btn-epic-sm">查看原始数据</button>
            </div>
            <pre id="device-auth-debug-output" class="debug-output"></pre>
        </details>
    </section>

    <!-- ===== Footer ===== -->
    <footer class="epic-footer">
        <p>📦 纯 HTTP API · 镜像 ~150MB</p>
        <p>基于 Epic Games 公开 API · 仅供参考</p>
    </footer>

</div>

<script src="/static/device_auth.js?v=11"></script>
<script src="/static/free_games.js?v=5"></script>
</body>
</html>
