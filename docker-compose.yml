version: "3.8"

services:
  epic-claimer:
    build: .
    container_name: epic-games-claimer
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
    volumes:
      # 仅挂载日志、截图、数据，账号密码密文在 /app/data 下
      - ./logs:/app/logs
      - ./screenshots:/app/screenshots
      - ./data:/app/data
    # 安全加固
    security_opt:
      - no-new-privileges:true
    # 资源限制
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "1.5"