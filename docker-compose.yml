version: "3.8"

services:
  epic-claimer:
    image: zz3656/epic-games-helper:latest
    container_name: epic-games-helper
    build: .
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - TZ=Asia/Shanghai
      # Epic Games 免费游戏在 北京时间每周五 0:00 更新
      # 设为周五 0:05 检查，避开高峰期
      - SCHEDULE_DAY=fri
      - SCHEDULE_HOUR=0
      - SCHEDULE_MINUTE=5
      - AUTO_CLAIM_ENABLED=true
      # Webhook 推送（可选，需要取消注释并填入实际值）
      # - NOTIFY_WEBHOOK_TYPE=bark
      # - NOTIFY_WEBHOOK_URL=https://api.day.app
      # - NOTIFY_WEBHOOK_TOKEN=your_device_key
      - LOG_LEVEL=INFO
    volumes:
      # 持久化加密的 device auth + 日志 + 截图
      - ./logs:/app/logs
      - ./screenshots:/app/screenshots
      - ./data:/app/data
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
