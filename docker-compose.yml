version: "3.8"

services:
  epic-helper:
    image: zz3656/epic-games-helper:latest
    container_name: epic-games-helper
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - TZ=Asia/Shanghai
      # Epic Games 免费游戏在北京时间每周五 0:00 更新
      # 设为周五 0:05 检查，避开高峰期
      - SCHEDULE_DAY=fri
      - SCHEDULE_HOUR=0
      - SCHEDULE_MINUTE=5
      # Webhook 全局推送（可选，需要取消注释并填入实际值）
      # - NOTIFY_WEBHOOK_TYPE=pushplus
      # - NOTIFY_WEBHOOK_TOKEN=your_token
      - LOG_LEVEL=INFO
    volumes:
      # 持久化：历史记录、封面映射
      - ./logs:/app/logs
      # 持久化：用户数据、配置密钥
      - ./data:/app/data
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
