version: "3.8"

services:
  epic-claimer:
    image: zz3656/epic-games-helper:latest
    container_name: epic-games-helper
    build: .
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - TZ=Asia/Shanghai
      - SCHEDULE_DAY=thu
      - SCHEDULE_HOUR=17
      - SCHEDULE_MINUTE=0
      - AUTO_CLAIM_ENABLED=true
      - LOG_LEVEL=INFO
    volumes:
      # 持久化加密的 device auth + 日志 + 截图
      - ./logs:/app/logs
      - ./screenshots:/app/screenshots
      - ./data:/app/data
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
